version: "3.9"

services:
  backend:
    image: python:3.11-slim
    working_dir: /app/facial-auth-app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app/facial-auth-frontend
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: >
      sh -c "npm install
      && npm run dev -- --host"
